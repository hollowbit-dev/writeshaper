<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>Writeshaper</title>
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="panel.css">
</head>
<body>
<div class="stage">
  <div class="frame" id="frame">
  <div class="halo" aria-hidden="true"></div>
  <div class="glow" aria-hidden="true"></div>
  <div class="card" id="card">
    <header class="top">
      <div class="brand"><img src="../../assets/icon.png" alt=""><span>Writeshaper</span></div>
      <div class="status" id="status"><span class="dot"></span><span id="statusText">Ready</span></div>
      <div class="top-right">
        <button class="icon-btn" id="pin" title="Keep open"><svg viewBox="0 0 16 16"><path d="M10.2 1.8 14.2 5.8 12.6 6.4 9.9 9.1 9.6 12 8.4 13.2 5.6 10.4 2.6 13.4 2.6 13.4 5.6 10.4 2.8 7.6 4 6.4 6.9 6.1 9.6 3.4z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></button>
        <button class="icon-btn" id="openApp" title="Open in Writeshaper"><svg viewBox="0 0 16 16"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button class="esc" id="close"><span class="kbd">esc</span></button>
      </div>
    </header>

    <div class="body">
      <textarea id="input" class="input" placeholder="Type or paste text, then pick what to do." spellcheck="false" hidden></textarea>
      <div class="result" id="result" tabindex="-1"></div>
      <div class="error" id="error" hidden></div>
    </div>

    <div class="ask" id="ask" hidden>
      <svg viewBox="0 0 16 16"><path d="M8 1.5l1.3 3.6 3.7 1.4-3.7 1.4L8 11.5 6.7 7.9 3 6.5l3.7-1.4z" fill="currentColor"/></svg>
      <input id="askInput" placeholder="Tell it what to change, like “make it a bullet list”" spellcheck="false">
      <span class="kbd">↵</span>
    </div>

    <div class="langs" id="langs" hidden></div>

    <nav class="modes" id="modes">
      <button data-mode="fix" title="Fix ({MOD}1)">Fix</button>
      <button data-mode="clear" title="Clearer ({MOD}2)">Clearer</button>
      <button data-mode="short" title="Shorter ({MOD}3)">Shorter</button>
      <button data-mode="friendly" title="Friendlier ({MOD}4)">Friendlier</button>
      <button data-mode="pro" title="Professional ({MOD}5)">Professional</button>
      <button data-mode="translate" title="Translate ({MOD}6)"><span id="tLabel">Translate</span></button>
      <button data-mode="ask" title="Ask ({MOD}7)">Ask</button>
      <span class="pill" id="pill"></span>
    </nav>

    <footer class="foot">
      <div class="seg" id="view">
        <span class="seg-pill"></span>
        <button data-v="changes" class="on">Changes</button>
        <button data-v="clean">Clean</button>
        <button data-v="before">Before</button>
      </div>
      <div class="count" id="count"></div>
      <div class="foot-right">
        <button class="btn" id="copy">Copy <span class="kbd" id="copyKey">⌘C</span></button>
        <button class="btn brand" id="replace"><span id="replaceLabel">Replace</span> <span class="kbd on-brand">↵</span></button>
      </div>
    </footer>
  </div>
  </div>
</div>
<script src="../diff.js"></script>
<script src="panel.js"></script>
</body>
</html>
